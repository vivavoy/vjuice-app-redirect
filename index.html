<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đang chuyển hướng...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background-color: #f9f9fb;
      color: #333;
      text-align: center;
      padding: 20px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #3498db;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .btn {
      margin-top: 15px;
      padding: 10px 20px;
      background-color: #007aff;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 500;
      display: inline-block;
    }
  </style>
</head>
<body>

  <div class="spinner"></div>
  <h2>Đang kết nối tới ứng dụng...</h2>
  <p>Nếu trang không tự động chuyển trong vài giây, vui lòng bấm nút bên dưới:</p>
  
  <a id="app-link" href="#" class="btn">Mở ứng dụng ngay</a>

  <script>
    // 1. Dán đường dẫn Web App của bạn vào đây
    const GAS_URL = "https://script.google.com/macros/s/AKfycbysz-i8SftUvT6r1pUAL3nDu1y88Jc8zEeAHMgeL7GT2H1Bj1GFu7nTDK_-g6I3uSGo/exec";

    // 2. Tự động thêm tham số authuser=0 để giảm lỗi xác thực trên Safari
    const targetUrl = GAS_URL + (GAS_URL.includes('?') ? '&' : '?') + "authuser=0";

    // Cập nhật thẻ <a> dự phòng
    document.getElementById("app-link").href = targetUrl;

    // 3. Thực hiện chuyển hướng toàn màn hình (Cực kỳ quan trọng đối với Safari)
    window.location.replace(targetUrl);
  </script>

</body>
</html>
